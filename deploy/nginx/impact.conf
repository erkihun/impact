server {
    listen 80;
    server_name impact.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name impact.example.org;
    root /var/www/impact/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/impact.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/impact.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 21m;
    add_header X-Deployment-Edge nginx always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2)$ {
        expires 7d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
