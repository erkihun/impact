<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Rising bars and a growth line in dark blue with an orange highlight">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3b5a"/>
      <stop offset="0.55" stop-color="#17324d"/>
      <stop offset="1" stop-color="#0f2438"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f28c28" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f28c28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8fc4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4c8fc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6690"/>
      <stop offset="1" stop-color="#21425f"/>
    </linearGradient>
    <linearGradient id="barAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a24a"/>
      <stop offset="1" stop-color="#d9661a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#ground)"/>

  <!-- Soft light fields: smooth gradients, no texture. -->
  <circle cx="1180" cy="250" r="520" fill="url(#glow)"/>
  <circle cx="300" cy="820" r="560" fill="url(#cool)"/>

  <!-- Concentric orbits. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1180" cy="250" r="180"/>
    <circle cx="1180" cy="250" r="300"/>
    <circle cx="1180" cy="250" r="430"/>
    <circle cx="1180" cy="250" r="570"/>
  </g>

  <!-- Baseline. -->
  <line x1="300" y1="860" x2="1300" y2="860" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Rising bars. -->
  <g>
    <rect x="330" y="740" width="84" height="120" rx="18" fill="url(#bar)"/>
    <rect x="470" y="690" width="84" height="170" rx="18" fill="url(#bar)"/>
    <rect x="610" y="620" width="84" height="240" rx="18" fill="url(#bar)"/>
    <rect x="750" y="560" width="84" height="300" rx="18" fill="url(#bar)"/>
    <rect x="890" y="480" width="84" height="380" rx="18" fill="url(#bar)"/>
    <rect x="1030" y="400" width="84" height="460" rx="18" fill="url(#bar)"/>
    <rect x="1170" y="300" width="84" height="560" rx="18" fill="url(#barAccent)"/>
  </g>

  <!-- Growth line through the bar tops. -->
  <polyline points="372,700 512,650 652,580 792,520 932,440 1072,360 1212,250"
            fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#17324d" stroke="#ffffff" stroke-width="4">
    <circle cx="372" cy="700" r="11"/>
    <circle cx="512" cy="650" r="11"/>
    <circle cx="652" cy="580" r="11"/>
    <circle cx="792" cy="520" r="11"/>
    <circle cx="932" cy="440" r="11"/>
    <circle cx="1072" cy="360" r="11"/>
  </g>
  <circle cx="1212" cy="250" r="44" fill="#f28c28" fill-opacity="0.22"/>
  <circle cx="1212" cy="250" r="18" fill="#f28c28" stroke="#ffffff" stroke-width="4"/>

  <!-- Frosted glass panel. -->
  <g>
    <rect x="300" y="200" width="420" height="250" rx="32" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="362" cy="266" r="22" fill="#f28c28"/>
    <rect x="406" y="252" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="406" y="278" width="130" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="340" y="334" width="340" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="340" y="362" width="280" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="340" y="390" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
  </g>
</svg>
